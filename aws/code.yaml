AWSTemplateFormatVersion: '2010-09-09'
Description: The versioned bucket that holds a stack's Web Function code (aws/template.yaml); one per stack, made before the first deploy
Resources:
  Code:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      # A Web Function revision pins the zip by S3 version, so the bucket keeps every version.
      VersioningConfiguration: { Status: Enabled }
      PublicAccessBlockConfiguration: { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      LifecycleConfiguration:
        Rules:
          - { Id: old-versions, Status: Enabled, NoncurrentVersionExpiration: { NoncurrentDays: 90 } }
  CodePolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Code
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: [s3:GetObject, s3:GetObjectVersion]
            Resource: !Sub '${Code.Arn}/*'
            Condition: { StringEquals: { 'aws:SourceAccount': !Ref 'AWS::AccountId' } }
Outputs:
  CodeBucket: { Value: !Ref Code }
