AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  The role an agent on the Switchboard host assumes to deploy and check capsule-host-dev without SSO (capsule-host-agent-dev).
  It changes the dev stack only through CloudFormation with the role made here, which may make roles capsule-host-dev-* only and
  only under the boundary made here; it makes no role, user, access key or policy itself, and touches nothing of capsule-host-prod.
  Deployed by a person with the administrator's SSO: see aws/README.md.
Parameters:
  HostRoleArn:
    Type: String
    Description: The Switchboard host's InstanceRole ARN (switchboard-host stack), the only principal that may assume the agent role
  DevDistributionId:
    Type: String
    AllowedPattern: 'E[A-Z0-9]+'
    Description: The CloudFront distribution of capsule-host-dev (its DistributionId output); its ARN holds no stack name
  DevEdgeConfigs:
    Type: CommaDelimitedList
    Description: >-
      capsule-host-dev's CloudFront access controls and policies, as type/id (origin-access-control/<Access>,
      origin-access-control/<WebAccess>, response-headers-policy/<SecurityHeaders>, origin-request-policy/<ApiRequest>, from
      aws cloudformation describe-stack-resources); their ARNs hold no stack name, so they are named here
Resources:
  # sam deploy's code and template for the dev stack. Not the SAM CLI's shared bucket (--resolve-s3): prod is deployed through
  # that one, under the same keys, so a role that could write there could swap what a prod deploy picks up.
  Artifacts:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration: { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      LifecycleConfiguration:
        Rules:
          - { Id: expire, Status: Enabled, ExpirationInDays: 7 }
  # The most a role made by the dev stack may do: what Host and WebRole in aws/template.yaml are given, on dev's resources only.
  # A role made through CfnRole without this boundary is refused, so a dev template cannot make a stronger role.
  Boundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: capsule-host-agent-dev-boundary
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: Data
            Effect: Allow
            Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:DeleteItem, dynamodb:UpdateItem, dynamodb:ConditionCheckItem, dynamodb:Query]
            Resource: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/capsule-host-dev-*'
          # The photos' bucket (aws/template.yaml, Media): what the Web Function and the Event Function put, read, take out and list.
          - Sid: Photos
            Effect: Allow
            Action: [s3:PutObject, s3:GetObject, s3:DeleteObject]
            Resource: 'arn:aws:s3:::capsule-host-dev-media-*/*'
          - Sid: PhotosList
            Effect: Allow
            Action: s3:ListBucket
            Resource: 'arn:aws:s3:::capsule-host-dev-media-*'
          - Sid: CreatorKeys
            Effect: Allow
            Action: [ssm:PutParameter, ssm:GetParameter, ssm:DeleteParameter, ssm:AddTagsToResource, ssm:ListTagsForResource, ssm:GetParametersByPath]
            Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/capsule-host/capsule-host-dev/*'
          - Sid: EventFunction
            Effect: Allow
            Action: lambda:InvokeFunction
            Resource: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:capsule-host-dev-*'
          - Sid: Logs
            Effect: Allow
            Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
            Resource:
              - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/capsule-host-dev-*'
              - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/capsule-host/capsule-host-dev/*'
  # What CloudFormation runs as for capsule-host-dev (the agent passes it with every change set). Resources whose name holds the
  # stack name are held to capsule-host-dev-*; the secret, which has no such name, to its stack tag; the distribution and
  # CloudFront's access controls and policies, which have only ids, to dev's ids (DevDistributionId, DevEdgeConfigs).
  CfnRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: capsule-host-agent-dev-cfn
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: cloudformation.amazonaws.com }
            Action: sts:AssumeRole
            Condition: { StringEquals: { 'aws:SourceAccount': !Ref AWS::AccountId } }
      Policies:
        - PolicyName: dev-stack
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # with a service role, CloudFormation runs the SAM transform as that role
              - Sid: Transform
                Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource: !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31'
              - Sid: Functions
                Effect: Allow
                Action: lambda:*
                Resource:
                  - !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:capsule-host-dev-*'
                  - !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:web-function/capsule-host-dev-*'
              - Sid: Code
                Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion]
                Resource:
                  - !Sub '${Artifacts.Arn}/*'
                  - !Sub 'arn:${AWS::Partition}:s3:::capsule-host-dev-code-*/*'
              - Sid: Data
                Effect: Allow
                Action: dynamodb:*
                Resource: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/capsule-host-dev-*'
              - Sid: Assets
                Effect: Allow
                Action: s3:*
                Resource: ['arn:aws:s3:::capsule-host-dev-assets-*', 'arn:aws:s3:::capsule-host-dev-assets-*/*', 'arn:aws:s3:::capsule-host-dev-media-*', 'arn:aws:s3:::capsule-host-dev-media-*/*']
              - Sid: Schedule
                Effect: Allow
                Action: events:*
                Resource: !Sub 'arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/capsule-host-dev-*'
              - Sid: LogGroups
                Effect: Allow
                Action: [logs:CreateLogGroup, logs:DeleteLogGroup, logs:PutRetentionPolicy, logs:DeleteRetentionPolicy, logs:TagResource, logs:UntagResource, logs:TagLogGroup, logs:UntagLogGroup, logs:ListTagsForResource, logs:ListTagsLogGroup]
                Resource:
                  - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/capsule-host-dev-*'
                  - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/capsule-host/capsule-host-dev/*'
              - Sid: Describe
                Effect: Allow
                Action: [logs:DescribeLogGroups, cloudfront:List*, secretsmanager:GetRandomPassword]
                Resource: '*'
              - Sid: Secret
                Effect: Allow
                Action: [secretsmanager:DescribeSecret, secretsmanager:GetSecretValue, secretsmanager:UpdateSecret, secretsmanager:PutSecretValue, secretsmanager:DeleteSecret, secretsmanager:TagResource, secretsmanager:UntagResource]
                Resource: '*'
                Condition: { StringEquals: { 'aws:ResourceTag/aws:cloudformation:stack-name': capsule-host-dev } }
              - Sid: NewSecret
                Effect: Allow
                Action: secretsmanager:CreateSecret
                Resource: '*'
                Condition: { StringEquals: { 'aws:RequestTag/aws:cloudformation:stack-name': capsule-host-dev } }
              - Sid: Distribution
                Effect: Allow
                Action: [cloudfront:GetDistribution, cloudfront:GetDistributionConfig, cloudfront:UpdateDistribution, cloudfront:TagResource, cloudfront:UntagResource]
                Resource: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${DevDistributionId}'
              - Sid: EdgeFunction
                Effect: Allow
                Action: [cloudfront:CreateFunction, cloudfront:UpdateFunction, cloudfront:PublishFunction, cloudfront:DescribeFunction, cloudfront:GetFunction, cloudfront:DeleteFunction]
                Resource: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:function/capsule-host-dev-*'
              # A new one gets an id not yet in DevEdgeConfigs: changing it later needs this stack deployed again with the new id
              - Sid: NewEdgeConfig
                Effect: Allow
                Action: [cloudfront:CreateOriginAccessControl, cloudfront:CreateResponseHeadersPolicy, cloudfront:CreateOriginRequestPolicy]
                Resource: '*'
              - Sid: EdgeConfig
                Effect: Allow
                Action:
                  - cloudfront:GetOriginAccessControl
                  - cloudfront:UpdateOriginAccessControl
                  - cloudfront:DeleteOriginAccessControl
                  - cloudfront:GetResponseHeadersPolicy
                  - cloudfront:UpdateResponseHeadersPolicy
                  - cloudfront:DeleteResponseHeadersPolicy
                  - cloudfront:GetOriginRequestPolicy
                  - cloudfront:UpdateOriginRequestPolicy
                  - cloudfront:DeleteOriginRequestPolicy
                # Fn::Join takes a literal delimiter, so the account is a wildcard; the ids are unique and the role acts in its own account
                Resource: !Split [',', !Sub ['arn:${AWS::Partition}:cloudfront::*:${Ids}', { Ids: !Join [',arn:aws:cloudfront::*:', !Ref DevEdgeConfigs] }]]
              # The stack's own roles (HostRole, WebRole): capsule-host-dev-* only, and policies only while they carry the boundary
              # (IAM checks iam:PermissionsBoundary on these actions only)
              - Sid: Roles
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:PutRolePermissionsBoundary
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/capsule-host-dev-*'
                Condition: { StringEquals: { 'iam:PermissionsBoundary': !Ref Boundary } }
              # a role that cannot be made without the boundary nor lose it stays within it, whatever it trusts
              - Sid: OwnRoles
                Effect: Allow
                Action: [iam:GetRole, iam:GetRolePolicy, iam:ListRolePolicies, iam:ListAttachedRolePolicies, iam:ListRoleTags, iam:TagRole, iam:UntagRole, iam:UpdateRole, iam:UpdateAssumeRolePolicy, iam:DeleteRole]
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/capsule-host-dev-*'
              # to Lambda for a function and a Web Function revision (whose passing service is not documented, so no service condition).
              # PassRole has no boundary condition; every capsule-host-dev-* role carries the boundary (aws/README.md checks it)
              - Sid: PassRoles
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/capsule-host-dev-*'
        - PolicyName: guard
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Deny
                Action: iam:DeleteRolePermissionsBoundary
                Resource: '*'
  AgentRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: capsule-host-agent-dev
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{ Effect: Allow, Principal: { AWS: !Ref HostRoleArn }, Action: sts:AssumeRole }]
      Policies:
        # Deploy: change sets of capsule-host-dev only, run as CfnRole only
        - PolicyName: deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource: !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/capsule-host-dev/*'
                Condition: { StringEquals: { 'cloudformation:RoleArn': !GetAtt CfnRole.Arn } }
              - Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource: !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31'
              - Effect: Allow
                Action: [cloudformation:ExecuteChangeSet, cloudformation:DescribeChangeSet, cloudformation:DeleteChangeSet, cloudformation:ListChangeSets, cloudformation:DescribeStackEvents, cloudformation:GetTemplate, cloudformation:GetTemplateSummary]
                Resource: !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/capsule-host-dev/*'
              # reading the dev stacks (capsule-host-dev, its -code, and -edge-logs in us-east-1) for their outputs and resources
              - Effect: Allow
                Action: [cloudformation:DescribeStacks, cloudformation:DescribeStackResource, cloudformation:DescribeStackResources, cloudformation:ListStackResources]
                Resource:
                  - !Sub 'arn:${AWS::Partition}:cloudformation:*:${AWS::AccountId}:stack/capsule-host-dev/*'
                  - !Sub 'arn:${AWS::Partition}:cloudformation:*:${AWS::AccountId}:stack/capsule-host-dev-*/*'
              - Effect: Allow
                Action: [cloudformation:ValidateTemplate, cloudformation:GetTemplateSummary]
                Resource: '*'
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CfnRole.Arn
                Condition: { StringEquals: { 'iam:PassedToService': cloudformation.amazonaws.com } }
              - Effect: Allow
                Action: [s3:PutObject, s3:GetObject]
                Resource:
                  - !Sub '${Artifacts.Arn}/*'
                  - 'arn:aws:s3:::capsule-host-dev-code-*/*'
                  - 'arn:aws:s3:::capsule-host-dev-assets-*/*'
              - Effect: Allow
                Action: [s3:ListBucket, s3:GetBucketLocation]
                Resource: [!GetAtt Artifacts.Arn, 'arn:aws:s3:::capsule-host-dev-code-*', 'arn:aws:s3:::capsule-host-dev-assets-*']
              - Effect: Allow
                Action: [cloudfront:CreateInvalidation, cloudfront:GetInvalidation]
                Resource: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${DevDistributionId}'
        # Check: what aws/verify.ts, aws/verify-expiry.ts and aws/invoke.ts call, on dev only
        - PolicyName: check
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [lambda:InvokeFunction, lambda:GetFunction, lambda:GetFunctionConfiguration]
                Resource: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:capsule-host-dev-*'
              # aws/verify.ts counts what is left of a purged trip's photos in the bucket (names only, no read)
              - Effect: Allow
                Action: s3:ListBucket
                Resource: 'arn:aws:s3:::capsule-host-dev-media-*'
              - Effect: Allow
                Action: [dynamodb:Scan, dynamodb:DescribeTable]
                Resource: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/capsule-host-dev-*'
              # the cdn group is in us-east-1 (aws/edge-logs.yaml)
              - Effect: Allow
                Action: [logs:FilterLogEvents, logs:GetLogEvents, logs:DescribeLogStreams]
                Resource:
                  - !Sub 'arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:/aws/lambda/capsule-host-dev-*'
                  - !Sub 'arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:/capsule-host/capsule-host-dev/*'
        # Nothing in IAM beyond passing CfnRole, no import (it could adopt a prod resource into the dev stack), and not this stack
        - PolicyName: guard
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Deny
                Action: [iam:CreateRole, iam:CreateUser, iam:CreateAccessKey, iam:CreateLoginProfile, iam:CreateServiceSpecificCredential, iam:CreatePolicy, iam:CreatePolicyVersion, iam:PutRolePolicy, iam:AttachRolePolicy, iam:PutUserPolicy, iam:AttachUserPolicy, iam:UpdateAssumeRolePolicy, iam:DeleteRolePermissionsBoundary, iam:PutRolePermissionsBoundary]
                Resource: '*'
              - Effect: Deny
                Action: cloudformation:CreateChangeSet
                Resource: '*'
                Condition: { 'Null': { 'cloudformation:ImportResourceTypes': 'false' } }
              - Effect: Deny
                Action: cloudformation:*
                Resource: !Sub 'arn:${AWS::Partition}:cloudformation:*:${AWS::AccountId}:stack/capsule-host-agent-dev/*'
Outputs:
  RoleArn: { Value: !GetAtt AgentRole.Arn }
  CfnRoleArn: { Value: !GetAtt CfnRole.Arn }
  BoundaryArn: { Value: !Ref Boundary }
  ArtifactsBucket: { Value: !Ref Artifacts }
